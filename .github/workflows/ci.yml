name: CI - Frontend Build & Validate

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Validate Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application (Angular Build)
        run: |
          export API_URL="https://mock-api.com/api/v1"
          export MP_PUBLIC_KEY="mock_key"
          npm run build
