@if (!dismissed()) {
<div [class]="computedClasses() + ' animate-fade-in'" role="alert" aria-live="polite">
    <i class="pi shrink-0 text-base" [ngClass]="icon()" aria-hidden="true"></i>

    <div class="flex-1 flex flex-col gap-0.5">
        @if (title()) {
        <strong class="block font-semibold leading-tight">{{ title() }}</strong>
        }
        <div class="leading-snug">
            <ng-content />
        </div>
    </div>

    @if (closeable()) {
    <app-button 
        styleClass="inline-flex items-center justify-center bg-transparent border-none outline-none cursor-pointer p-0 m-0 opacity-50 shrink-0 w-[22px] h-[22px] rounded-full transition-all duration-200 text-inherit hover:opacity-100 hover:bg-black/5 hover:rotate-90 dark:hover:bg-white/10" 
        (clicked)="dismiss()" 
        [attr.aria-label]="content.closeAriaLabel" 
        variant="ghost" 
        icon="pi-times">
    </app-button>
    }
</div>
}
