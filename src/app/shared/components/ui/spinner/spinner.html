<div class="flex flex-col items-center justify-center gap-3" [class.fixed]="fullPage()" [class.inset-0]="fullPage()" [class.bg-white/75]="fullPage()" [class.dark:bg-slate-900/75]="fullPage()" [class.backdrop-blur-[2px]]="fullPage()" [class.z-[9998]]="fullPage()" aria-live="assertive">
    <p-progressSpinner [style]="{ width: spinnerSize(), height: spinnerSize() }" strokeWidth="3"
        animationDuration=".75s" aria-hidden="true" />
    @if (label()) {
    <span class="text-sm text-slate-500 dark:text-slate-400">{{ label() }}</span>
    }
</div>
