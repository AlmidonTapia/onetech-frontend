<header class="sticky top-0 z-[1000] shadow-[0_4px_20px_rgba(0,0,0,0.05)] bg-white/95 dark:bg-slate-900/95 backdrop-blur-md transition-all duration-300 border-b border-black/5 dark:border-white/5 dark:shadow-[0_4px_20px_rgba(0,0,0,0.3)]">

    <div class="bg-slate-900 dark:bg-black h-auto lg:h-9 flex items-center py-1.5 lg:py-0">
        <div class="container flex justify-between items-center">
            <span class="flex items-center gap-1.5 text-xs text-white/80">
                <i class="pi pi-truck"></i>
                {{ topbarInfo.left.text }}
            </span>
            <span class="hidden lg:flex items-center gap-1.5 text-xs text-white/80">
                <i class="pi pi-phone"></i>
                {{ topbarInfo.right[0].text }}
                &nbsp;|&nbsp;
                <i class="pi pi-clock"></i>
                {{ topbarInfo.right[1].text }}
            </span>
        </div>
    </div>

    <div class="bg-transparent h-auto lg:h-20 flex items-center transition-all duration-300">
        <div class="container flex flex-wrap lg:flex-nowrap justify-between items-center gap-3 lg:gap-6 py-3 lg:py-0">

            <button class="flex lg:hidden items-center justify-center bg-transparent border-none text-slate-800 dark:text-slate-100 text-2xl cursor-pointer p-2 mr-3" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Menú">
                <i class="pi" [ngClass]="isMobileMenuOpen ? 'pi-times' : 'pi-bars'"></i>
            </button>

            <a routerLink="/" class="flex items-center gap-2 text-none text-[26px] font-extrabold tracking-tight whitespace-nowrap shrink-0 order-1 lg:order-none" aria-label="OneTech — Inicio">
                <img src="/icono_wbg_small.png" alt="OneTech Logo" class="h-8 w-auto object-contain shrink-0">
                <div class="leading-none"><span class="text-slate-800 dark:text-slate-100">One</span><span class="text-orange-500">Tech</span></div>
            </a>

            <div class="block w-full max-w-full lg:max-w-[600px] flex-1 order-3 lg:order-none mt-1 lg:mt-0">
                <app-navbar-search />
            </div>

            <div class="flex items-center gap-0.5 lg:gap-1 shrink-0 order-2 lg:order-none ml-auto lg:ml-0">
                
                <app-theme-toggle />

                <app-navbar-user />

                @if (authService.isAuthenticated()) {
                <a *appHasRole="'ADMIN'" routerLink="/admin" class="flex items-center gap-2.5 p-2 lg:px-3.5 lg:py-2 rounded-lg text-slate-800 dark:text-slate-100 transition-all duration-300 hover:bg-slate-50 dark:hover:bg-slate-800 hover:-translate-y-0.5 hover:text-blue-600 dark:hover:text-blue-400 group">
                    <i class="pi pi-cog text-[20px] text-slate-500 transition-colors duration-300 group-hover:text-blue-600 dark:group-hover:text-blue-400"></i>
                    <div class="hidden lg:flex flex-col leading-tight">
                        <span class="text-[11px] text-slate-500 uppercase tracking-wide">Panel de</span>
                        <span class="text-[13px] font-semibold text-slate-800 dark:text-slate-100">Administración</span>
                    </div>
                </a>
                }

                <a routerLink="/wishlist" class="flex items-center gap-2.5 p-2 lg:px-3.5 lg:py-2 rounded-lg text-slate-800 dark:text-slate-100 transition-all duration-300 hover:bg-slate-50 dark:hover:bg-slate-800 hover:-translate-y-0.5 hover:text-blue-600 dark:hover:text-blue-400 group"
                    title="Mis favoritos">
                    <div class="relative flex items-center justify-center">
                        <i class="pi pi-heart text-[20px] text-slate-500 transition-colors duration-300 group-hover:text-blue-600 dark:group-hover:text-blue-400"></i>
                        @if (wishlistStore.count() > 0) {
                        <span class="absolute -top-1.5 -right-2 bg-gradient-to-br from-blue-600 to-blue-500 text-white text-[11px] font-bold min-w-[18px] h-[18px] rounded-full flex items-center justify-center px-1 shadow-md animate-[scaleIn_0.3s_cubic-bezier(0.175,0.885,0.32,1.275)]">{{ wishlistStore.count() }}</span>
                        }
                    </div>
                    <div class="hidden lg:flex flex-col leading-tight">
                        <span class="text-[11px] text-slate-500 uppercase tracking-wide">Lista de</span>
                        <span class="text-[13px] font-semibold text-slate-800 dark:text-slate-100">Favoritos</span>
                    </div>
                </a>

                <app-navbar-cart />
            </div>

        </div>
    </div>

    @if(isMobileMenuOpen) {
      <div class="fixed inset-0 bg-black/50 z-[90]" (click)="toggleMobileMenu()"></div>
    }

    <nav class="bg-gradient-to-r from-blue-600 to-blue-500 dark:bg-slate-800/80 dark:border-t dark:border-white/5 h-auto lg:h-12 flex items-center relative hidden lg:flex absolute lg:static top-full left-0 w-full shadow-md lg:shadow-none z-[100]" aria-label="Categorías" [ngClass]="{'block animate-[slideDown_0.3s_ease_forwards]': isMobileMenuOpen}">
        <div class="container relative">
            <div class="hidden">
                <h3>Menú</h3>
                <button (click)="toggleMobileMenu()" aria-label="Cerrar menú">
                    <i class="pi pi-times"></i>
                </button>
            </div>
            <app-navbar-menu />
        </div>
    </nav>

</header>
