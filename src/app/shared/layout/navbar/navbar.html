<header class="navbar-wrapper">

    <!-- ── Top bar ──────────────────────────────── -->
    <div class="navbar-topbar">
        <div class="container topbar-inner">
            <span class="topbar-left">
                <i class="pi pi-truck"></i>
                Envío gratis desde S/ 199 · Lima
            </span>
            <span class="topbar-right">
                <i class="pi pi-phone"></i>
                +51 (01) 234-5678 &nbsp;|&nbsp;
                <i class="pi pi-clock"></i>
                Lun–Sab 9am–6pm
            </span>
        </div>
    </div>

    <!-- ── Main bar ─────────────────────────────── -->
    <div class="navbar-main">
        <div class="container main-inner">

            <!-- Logo -->
            <a routerLink="/" class="navbar-logo" aria-label="OneTech — Inicio">
                <span class="logo-one">One</span><span class="logo-tech">Tech</span>
            </a>

            <!-- Search -->
            <div class="navbar-search">
                <app-navbar-search />
            </div>

            <!-- Actions -->
            <div class="navbar-actions">
                @if (authService.isAuthenticated()) {
                <a routerLink="/profile" class="action-link">
                    <i class="pi pi-user"></i>
                    <div class="action-text">
                        <span class="action-label">Mi cuenta</span>
                        <span class="action-name">{{ authService.currentUser()?.firstName }}</span>
                    </div>
                </a>
                } @else {
                <a routerLink="/auth/login" class="action-link">
                    <i class="pi pi-user"></i>
                    <div class="action-text">
                        <span class="action-label">Hola, ingresa</span>
                        <span class="action-name">Mi cuenta</span>
                    </div>
                </a>
                }

                <app-navbar-cart />
            </div>

        </div>
    </div>

    <!-- ── Category nav ─────────────────────────── -->
    <nav class="navbar-categories" aria-label="Categorías">
        <div class="container">
            <app-navbar-menu />
        </div>
    </nav>

</header>
