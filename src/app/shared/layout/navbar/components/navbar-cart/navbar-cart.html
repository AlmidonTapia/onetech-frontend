<a [routerLink]="content.cartRoute" class="cart-btn" [attr.aria-label]="content.ariaLabelCart">

    <div class="cart-icon-wrapper">
        <i [class]="content.cartIcon"></i>
        @if (itemCount() > 0) {
        <span class="cart-badge">{{ itemCount() }}</span>
        }
    </div>

    <div class="cart-text">
        <span class="cart-label">{{ content.labelText }}</span>
        <span class="cart-total">{{ totalAmount() | currencyPen }}</span>
    </div>

</a>
