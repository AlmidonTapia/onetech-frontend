<ul class="nav-menu" role="menubar">
    @for (cat of categories; track cat.label) {
    <li role="none">
        <a [routerLink]="cat.route" [queryParams]="cat.queryParams" class="nav-link"
            [ngClass]="{ 'nav-link--accent': cat.accent }" role="menuitem">
            {{ cat.label }}
        </a>
    </li>
    }
</ul>
