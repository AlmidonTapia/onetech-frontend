<form class="search-form" (ngSubmit)="search()" novalidate>
    <input type="text" class="search-input" [(ngModel)]="query" name="query" [placeholder]="content.placeholderText"
        autocomplete="off" [attr.aria-label]="content.ariaLabels.input" />

    <button type="submit" class="search-btn" [attr.aria-label]="content.ariaLabels.button">
        <i [class]="content.searchIcon"></i>
    </button>
</form>
