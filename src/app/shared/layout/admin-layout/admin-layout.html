<p-toast position="top-right" />
<app-modal />

<div class="flex min-h-screen bg-slate-50 dark:bg-slate-900 transition-all duration-300 md:flex-row flex-col" [class.sidebar-collapsed]="isSidebarCollapsed">
    <div class="hidden md:hidden items-center gap-4 px-5 h-16 bg-gradient-to-r from-[#0b1528] to-[#060c18] border-b border-white/5 fixed top-0 left-0 w-full z-[999] shadow-[0_4px_12px_rgba(0,0,0,0.15)] [display:flex]">
        <app-button styleClass="!text-white !text-xl !cursor-pointer !flex !items-center !justify-center !w-11 !h-11 !bg-white/5 !rounded-full !border !border-white/10 !transition-all !duration-[300ms] !ease-[cubic-bezier(0.175,0.885,0.32,1.275)] hover:!bg-white/10 hover:!-translate-y-0.5" (clicked)="isSidebarCollapsed = !isSidebarCollapsed" aria-label="Menu" variant="ghost" icon="pi-bars"></app-button>
        <a routerLink="/admin/dashboard" class="text-lg font-extrabold text-white no-underline tracking-tighter flex items-center gap-2">
            <img src="/icono_wbg_small.png" alt="OneTech Logo" class="h-7 w-auto object-contain shrink-0">
            <div class="leading-none"><span class="text-white">One</span><span class="text-blue-500">Tech</span></div>
            <span class="text-[9px] font-bold bg-blue-500 text-white px-1.5 py-0.5 rounded-sm ml-1.5 uppercase">Admin</span>
        </a>
    </div>

    <app-admin-sidebar [collapsedState]="isSidebarCollapsed" (collapsedChange)="isSidebarCollapsed = $event" />

    <div class="flex-1 flex flex-col min-h-screen transition-[margin-left] duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] md:ml-[var(--ot-sidebar-width)] md:[.sidebar-collapsed_&]:ml-[68px] ml-0 [.sidebar-collapsed_&]:ml-0">
        <app-admin-topbar (toggleSidebar)="isSidebarCollapsed = !isSidebarCollapsed" />
        <div class="flex-1 bg-slate-50 dark:bg-slate-900 transition-all duration-[300ms] ease-[cubic-bezier(0.175,0.885,0.32,1.275)] animate-[fadeIn_0.2s_ease_both] lg:p-10 p-6 md:p-6 pt-[88px] pb-10 px-4 md:pt-10" (click)="closeSidebarOnMobileClick()">
            <router-outlet />
        </div>
    </div>
</div>
