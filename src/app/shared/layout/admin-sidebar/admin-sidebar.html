<aside class="admin-sidebar" [class.sidebar-collapsed]="collapsed()">

    <div class="sidebar-header">
        <a routerLink="/admin/dashboard" class="flex items-center gap-2 mb-8 px-2 text-2xl font-bold tracking-tight" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
            <img src="/icono_wbg_small.png" alt="OneTech Logo" style="height: 32px; width: auto; object-fit: contain; flex-shrink: 0;">
            <div style="line-height: 1;">
              @if (!collapsed()) {
              <span class="logo-one">One</span><span class="logo-tech">Tech</span>
              } @else {
              <span class="logo-tech">{{ t().adminLayout.sidebar.logoCollapsed }}</span>
              }
            </div>
        </a>


        <button class="collapse-btn" (click)="toggleCollapse()"
            [attr.aria-label]="collapsed() ? t().adminLayout.sidebar.ariaLabelExpand : t().adminLayout.sidebar.ariaLabelCollapse">
            <i class="pi pi-bars"></i>
        </button>
    </div>

    <nav class="sidebar-nav" [attr.aria-label]="t().adminLayout.sidebar.ariaLabelNav">
        <ul>
            @for (item of navItems; track item.route) {
            <li>
                <a [routerLink]="item.route" routerLinkActive="nav-active" class="nav-item"
                    [attr.title]="collapsed() ? item.label : null">
                    <i class="pi nav-icon" [ngClass]="item.icon"></i>
                    @if (!collapsed()) {
                    <span class="nav-label">{{ item.label }}</span>
                    }
                </a>
            </li>
            }
        </ul>
    </nav>


</aside>
