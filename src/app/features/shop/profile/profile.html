<div class="profile-page">
    <div class="container">
        <app-breadcrumb [items]="breadcrumb" />

        <div class="profile-layout">
            <!-- Sidebar -->
            <aside class="profile-sidebar">
                <div class="account-card">
                    <div class="account-avatar">
                        {{ (authService.currentUser()?.firstName || content.defaultAvatarLetter)[0].toUpperCase() }}
                    </div>
                    <div class="account-info">
                        <h1>
                            {{ authService.currentUser()?.firstName }}
                            {{ authService.currentUser()?.lastName }}
                        </h1>
                        <p>{{ authService.currentUser()?.email }}</p>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    @for (item of content.sidebarMenu; track item.label) {
                        <a [routerLink]="item.route" routerLinkActive="active" class="sidebar-link">
                            <i [class]="item.icon"></i>
                            <span>{{ item.label }}</span>
                        </a>
                    }
                </nav>

                <div class="sidebar-footer">
                    <button class="profile-logout-btn" (click)="onLogout()">
                        <i class="pi pi-sign-out"></i>
                        <span>{{ content.logoutLabel }}</span>
                    </button>
                </div>
            </aside>

            <main class="profile-content">
                <router-outlet></router-outlet>
            </main>
        </div>
    </div>
</div>
