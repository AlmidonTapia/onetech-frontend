<div class="flex flex-col gap-5">
  <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2 m-0 mb-4">
    <i class="pi pi-credit-card text-blue-600 dark:text-blue-500"></i> Método de pago
  </h3>
  <div class="flex flex-col gap-3">
    @for (m of methods(); track m.idPaymentMethod) {
    <div class="flex items-center gap-4 px-5 py-4 border-2 rounded-[24px] cursor-pointer transition-all duration-300" 
      [ngClass]="selectedId() === m.idPaymentMethod ? 'border-blue-600 bg-blue-50/50 dark:bg-blue-900/20 shadow-[0_4px_12px_rgba(37,99,235,0.08)]' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-blue-600 hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:-translate-y-[1px] hover:shadow-sm'"
      (click)="select(m)">
      <div class="w-5 h-5 rounded-full border-2 shrink-0 flex items-center justify-center transition-all duration-200"
        [ngClass]="selectedId() === m.idPaymentMethod ? 'border-blue-600 bg-blue-600 shadow-[inset_0_0_0_4px_#ffffff] dark:shadow-[inset_0_0_0_4px_#0f172a]' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'"></div>
      <span class="text-sm font-bold text-slate-800 dark:text-slate-100">{{ m.methodName }}</span>
    </div>
    }
  </div>

  <div class="mt-6 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-5 rounded-2xl">
    <h4 class="text-sm font-semibold text-slate-800 dark:text-slate-100 mb-3 m-0">¿Tienes un código de descuento?</h4>
    <div class="flex gap-2">
      <input type="text" [(ngModel)]="couponCode" placeholder="Código de descuento" [disabled]="!!selectedCouponId"
        class="flex-1 px-3.5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-[13px] outline-none transition-colors focus:border-blue-600 disabled:bg-slate-100 disabled:text-slate-500">
      <app-button variant="outline" label="Aplicar" [loading]="validatingCoupon" [disabled]="!couponCode || !!selectedCouponId" (clicked)="onApplyCoupon()" />
    </div>
    @if (couponError) {
      <small class="block mt-2 text-xs text-red-500 font-medium">{{ couponError }}</small>
    }
    @if (discountAmount > 0) {
      <small class="block mt-2 text-xs text-green-600 dark:text-green-500 font-medium">Cupón aplicado correctamente</small>
    }
  </div>
</div>
