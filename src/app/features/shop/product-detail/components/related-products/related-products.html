@if (products.length > 0) {
<section class="pt-10 border-t border-slate-200 dark:border-slate-700">
  <h3 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100 mb-6 tracking-tight">Productos relacionados</h3>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
    @for (product of products.slice(0, displayConfig.maxItems); track product.idProduct) {
    <app-product-card [product]="product" />
    }
  </div>
</section>
}
