<div class="review-form-container card p-4 border border-gray-100 rounded-xl bg-gray-50/50 dark:bg-gray-800/50 dark:border-gray-700 mt-4">
  <h3 class="text-xl font-bold mb-1">{{ content.title }}</h3>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">{{ content.subtitle }}</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
    
    <div class="form-field flex flex-column gap-1">
      <label class="font-medium text-sm">{{ content.fields.rating }} *</label>
      <p-rating formControlName="rating"></p-rating>
      @if (isInvalid('rating')) {
        <small class="text-red-500">{{ content.errors.ratingRequired }}</small>
      }
    </div>

    <div class="form-field flex flex-column gap-1">
      <label for="title" class="font-medium text-sm">{{ content.fields.reviewTitle }} *</label>
      <input pInputText id="title" formControlName="title" class="w-full"
        [class.ng-invalid]="isInvalid('title')" [class.ng-dirty]="isInvalid('title')" />
      @if (isInvalid('title')) {
        <small class="text-red-500">{{ content.errors.required }}</small>
      }
    </div>

    <div class="form-field flex flex-column gap-1">
      <label for="comment" class="font-medium text-sm">{{ content.fields.comment }} *</label>
      <textarea pTextarea id="comment" formControlName="comment" rows="4" class="w-full" style="resize: vertical"
        [class.ng-invalid]="isInvalid('comment')" [class.ng-dirty]="isInvalid('comment')"></textarea>
      @if (isInvalid('comment')) {
        <small class="text-red-500">{{ content.errors.required }}</small>
      }
    </div>

    <div class="mt-2 text-right">
      <app-button type="submit" variant="primary" [label]="content.submitLabel" [loading]="loading()" />
    </div>

  </form>
</div>
