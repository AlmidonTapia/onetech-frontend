<div class="images-wrapper">
  @if (images.length > 1) {
    <div class="thumbnails-container">
      @for (img of images; track img.idProductImage) {
        <button class="thumb-btn" [class.thumb-btn--active]="active() === img.imageUrl"
                (click)="active.set(img.imageUrl)">
          <img [src]="img.imageUrl" [alt]="content.thumbImageAlt" />
        </button>
      }
    </div>
  }

  <div class="main-image-container">
    @if (active()) {
      <img class="main-img" [src]="active()!" [alt]="content.mainImageAlt" />
    } @else {
      <div class="img-placeholder"><i class="pi pi-image"></i></div>
    }

        <span class="badge-new">{{ content.newBadge }}</span>

    <button class="zoom-btn" [attr.aria-label]="content.zoomAriaLabel" (click)="toggleZoom()">
      <i class="pi pi-expand"></i>
    </button>

    <div class="label-referential">{{ content.referentialLabel }}</div>
  </div>
</div>

<p-dialog [visible]="zoomVisible()" (visibleChange)="zoomVisible.set($event)" 
          [modal]="true" [dismissableMask]="true" [showHeader]="false" 
          styleClass="zoom-dialog" [style]="{width: 'auto', 'max-width': '90vw'}">
  <div class="zoom-dialog-content">
    <button class="close-zoom-btn" (click)="toggleZoom()"><i class="pi pi-times"></i></button>
    <img [src]="active()!" class="zoomed-img" [alt]="content.zoomImageAlt" />
  </div>
</p-dialog>
