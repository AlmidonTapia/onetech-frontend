<div class="flex flex-col gap-4 w-full h-full max-w-full">
    @if (active()) {
    <div class="relative w-full aspect-square md:aspect-[4/3] lg:aspect-square bg-slate-50 dark:bg-slate-800/50 rounded-[16px] md:rounded-[20px] overflow-hidden group border border-slate-100 dark:border-slate-700 shadow-sm cursor-zoom-in" (click)="toggleZoom()">
      <img class="w-full h-full object-cover rounded-[16px] md:rounded-[20px] transition-transform duration-500 group-hover:scale-105" [ngSrc]="active()!" fill priority alt="Imagen del producto" />

      @if (badge) {
      <div class="absolute top-4 left-4 z-10 pointer-events-auto">
        @if (badge === 'SALE') { <div class="bg-red-500 text-white text-[10px] font-bold uppercase px-2 py-1 rounded-full shadow-sm">Oferta</div> }
        @if (badge === 'BESTSELLER') { <div class="bg-amber-500 text-white text-[10px] font-bold uppercase px-2 py-1 rounded-full shadow-sm">Más vendido</div> }
        @if (badge === 'NEW') { <div class="bg-blue-500 text-white text-[10px] font-bold uppercase px-2 py-1 rounded-full shadow-sm">Nuevo</div> }
      </div>
      }

      <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300 pointer-events-none rounded-[16px] md:rounded-[20px]"></div>

      <div class="absolute top-4 right-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <button type="button" class="relative w-9 h-9 md:w-10 md:h-10 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 cursor-pointer transition-all duration-200 shadow-sm pointer-events-auto hover:text-blue-500 hover:scale-110" aria-label="Ampliar imagen" (click)="toggleZoom()">
          <i class="pi pi-search-plus text-sm md:text-base"></i>
        </button>
      </div>
      
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
        <div class="relative bg-slate-900/80 text-white text-[10px] font-bold tracking-wide px-3 py-1.5 rounded bg-opacity-80 backdrop-blur-sm pointer-events-auto">Imagen referencial</div>
      </div>
    </div>
    } @else {
    <div class="w-full aspect-square md:aspect-[4/3] lg:aspect-square bg-slate-100 dark:bg-slate-800 rounded-[16px] md:rounded-[20px] flex items-center justify-center animate-pulse border border-slate-200 dark:border-slate-700">
      <i class="pi pi-image text-4xl md:text-5xl text-slate-300 dark:text-slate-600"></i>
    </div>
    }

    <div class="flex gap-2.5 overflow-x-auto pb-2 scrollbar-none snap-x pointer-events-auto mt-4 px-1" role="tablist">
      @for (img of images; track img.idProductImage) {
      <button type="button" class="relative w-16 h-16 md:w-20 md:h-20 shrink-0 rounded-xl overflow-hidden cursor-pointer transition-all duration-200 snap-center outline-none bg-slate-50 dark:bg-slate-800/50 border-2 shadow-sm" [class.border-blue-500]="active() === img.imageUrl" [class.opacity-100]="active() === img.imageUrl" [class.border-transparent]="active() !== img.imageUrl" [class.opacity-60]="active() !== img.imageUrl" [class.hover:opacity-100]="active() !== img.imageUrl" [class.hover:border-slate-300]="active() !== img.imageUrl" [class.dark:hover:border-slate-600]="active() !== img.imageUrl" (click)="active.set(img.imageUrl)" role="tab" [attr.aria-selected]="active() === img.imageUrl">
        <div class="absolute inset-0 bg-white/20 dark:bg-black/20 opacity-0 transition-opacity duration-200" [class.opacity-100]="active() === img.imageUrl"></div>
        <div class="w-full h-full p-1.5 box-border flex items-center justify-center">
          <img [ngSrc]="img.imageUrl" width="64" height="64" alt="Miniatura" class="w-full h-full object-cover" />
        </div>
      </button>
      }
    </div>
  </div>

  <p-dialog [(visible)]="zoomVisible" [modal]="true" [dismissableMask]="true" [draggable]="false" [resizable]="false" [showHeader]="false" styleClass="[&::ng-deep_.p-dialog-content]:p-0 [&::ng-deep_.p-dialog-content]:bg-transparent [&::ng-deep_.p-dialog-content]:rounded-[24px] max-w-[90vw] md:max-w-[80vw] lg:max-w-[1000px] w-full">
    <div class="relative w-full aspect-square md:aspect-video flex items-center justify-center pointer-events-none group/zoom">
      <div class="absolute inset-0 rounded-[24px] overflow-hidden">
        <div class="absolute inset-0 bg-white dark:bg-slate-900 shadow-2xl scale-[1.01]"></div>
      </div>
      @if (active()) {
      <div class="relative w-full h-full pointer-events-auto">
        <app-button styleClass="!absolute !top-4 !right-4 !w-11 !h-11 !rounded-full !bg-white dark:!bg-slate-800 !border !border-slate-200 dark:!border-slate-700 !flex !items-center !justify-center !cursor-pointer !shadow-lg !text-slate-700 dark:!text-slate-300 !z-[9999] hover:!scale-110 hover:!rotate-90 hover:!text-red-500 !transition-all !duration-200" (clicked)="toggleZoom()" variant="ghost" icon="pi-times"></app-button>
        <img [ngSrc]="active()!" class="w-full h-full object-contain rounded-[24px] bg-white dark:bg-slate-800 p-6 shadow-xl box-border" fill alt="Imagen ampliada" />
      </div>
      }
    </div>
  </p-dialog>
