<div class="bg-slate-50 dark:bg-slate-900 min-h-screen pb-20">
  <section class="bg-blue-600 pt-20 pb-40 relative overflow-hidden text-center">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.1),transparent_60%)] pointer-events-none"></div>
    <div class="container mx-auto px-4 relative z-10">
      <h1 class="text-[40px] md:text-5xl font-extrabold text-white m-0 mb-4 tracking-tight">Preguntas Frecuentes</h1>
      <p class="text-lg text-white/85 max-w-[600px] mx-auto m-0">Encuentra respuestas rápidas a las dudas más comunes</p>
    </div>
  </section>

  <div class="container mx-auto px-4 relative z-20 -mt-20 max-w-[900px]">
    <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 md:p-12 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] dark:shadow-[0_10px_40px_-10px_rgba(0,0,0,0.3)] border border-slate-100 dark:border-white/5 mb-10">
      @for (category of content.categories; track category.title) {
      <section class="mb-8 last:mb-0">
        <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-50 m-0 mb-4">{{ category.title }}</h2>
        @for (faq of category.faqs; track faq.question) {
        <div class="mb-4 last:mb-0">
          <p class="font-bold text-slate-900 dark:text-slate-100 m-0 mb-1">{{ faq.question }}</p>
          <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400 m-0">{{ faq.answer }}</p>
        </div>
        }
      </section>
      }
    </div>
  </div>
</div>
