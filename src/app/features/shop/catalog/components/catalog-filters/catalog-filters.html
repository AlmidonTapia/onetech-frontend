<aside class="filters-panel">
  <div class="filters-header">
    <h3>{{ content.mainTitle }}</h3>
    <button class="reset-btn" (click)="onReset()">{{ content.resetBtnText }}</button>
  </div>

  <div class="filter-group">
    <button class="filter-title-btn" (click)="isCategoryOpen = !isCategoryOpen">
      {{ content.categoryTitle }}
      <i class="pi" [class.pi-angle-up]="isCategoryOpen" [class.pi-angle-down]="!isCategoryOpen"></i>
    </button>
    @if (isCategoryOpen) {
    <ul class="filter-options animate-fade-in">
      <li>
        <label class="filter-option" [class.filter-option--active]="!localFilters.categoryId">
          <input type="radio" name="category" [value]="undefined" [(ngModel)]="localFilters.categoryId" />
          <span>{{ content.allCategoriesOption }}</span>
        </label>
      </li>
      @for (cat of categories; track cat.idCategory) {
      <li>
        <label class="filter-option" [class.filter-option--active]="localFilters.categoryId === cat.idCategory">
          <input type="radio" name="category" [value]="cat.idCategory" [(ngModel)]="localFilters.categoryId" />
          <span>{{ cat.categoryName }}</span>
        </label>
      </li>
      }
    </ul>
    }
  </div>

  <div class="filter-group">
    <button class="filter-title-btn" (click)="isBrandOpen = !isBrandOpen">
      {{ content.brandTitle }}
      <i class="pi" [class.pi-angle-up]="isBrandOpen" [class.pi-angle-down]="!isBrandOpen"></i>
    </button>
    @if (isBrandOpen) {
    <ul class="filter-options animate-fade-in">
      <li>
        <label class="filter-option" [class.filter-option--active]="!localFilters.brandId">
          <input type="radio" name="brand" [value]="undefined" [(ngModel)]="localFilters.brandId" />
          <span>Todas</span>
        </label>
      </li>
      @for (brand of brands; track brand.idBrand) {
      <li>
        <label class="filter-option" [class.filter-option--active]="localFilters.brandId === brand.idBrand">
          <input type="radio" name="brand" [value]="brand.idBrand" [(ngModel)]="localFilters.brandId" />
          <span>{{ brand.brandName }}</span>
        </label>
      </li>
      }
    </ul>
    }
  </div>

  <div class="filter-group">
    <button class="filter-title-btn" (click)="isPriceOpen = !isPriceOpen">
      {{ content.priceTitle }}
      <i class="pi" [class.pi-angle-up]="isPriceOpen" [class.pi-angle-down]="!isPriceOpen"></i>
    </button>
    @if (isPriceOpen) {
    <div class="price-inputs animate-fade-in">
      <input type="number" [(ngModel)]="localFilters.minPrice" [placeholder]="content.minPricePlaceholder" min="0" />
      <span class="price-sep">—</span>
      <input type="number" [(ngModel)]="localFilters.maxPrice" [placeholder]="content.maxPricePlaceholder" min="0" />
    </div>
    }
  </div>

  <app-button variant="primary" [label]="content.applyBtnLabel" [icon]="content.applyBtnIcon" [fullWidth]="true"
    (clicked)="onApply()" />
</aside>
