<section class="py-12">
  <div class="container">

    <div class="flex flex-col xs:flex-row items-start xs:items-center justify-between mb-6 flex-wrap gap-2 xs:gap-4">
      <h2 class="text-[20px] sm:text-[22px] md:text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight m-0">{{ title }}</h2>
      <a [routerLink]="content.viewAllRoute" class="text-sm font-semibold text-blue-600 dark:text-blue-400 whitespace-nowrap transition-colors duration-300 hover:text-blue-800 dark:hover:text-blue-500 hover:underline">{{ content.viewAllText }}</a>
    </div>

    @if (products.length === 0) {
    <div class="grid grid-cols-1 custom-md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
      @for (_ of skeletonConfig.items; track $index) {
      <div class="h-[300px] md:h-[320px] lg:h-[360px] rounded-2xl md:rounded-[24px] bg-[linear-gradient(90deg,#ffffff_25%,#e2e8f0_50%,#ffffff_75%)] dark:bg-[linear-gradient(90deg,#1e293b_25%,#334155_50%,#1e293b_75%)] bg-[length:200%_100%] animate-[shimmer_1.5s_infinite]"></div>
      }
    </div>
    }

    @else {
    <div class="grid grid-cols-1 custom-md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 items-stretch [&>app-product-card]:flex [&>app-product-card]:self-stretch [&>app-product-card>.product-card]:h-full [&>app-product-card>.product-card]:min-h-0">
      @for (product of products; track product.idProduct) {
      <app-product-card [product]="product" />
      }
    </div>
    }

  </div>
</section>
