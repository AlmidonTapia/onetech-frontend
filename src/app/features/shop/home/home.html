<div class="home-page">
  <app-hero-banner />

  <!-- Trust Badges -->
  <app-trust-badges />

  <div class="container sections-container">
    <app-featured-categories />
    <app-featured-products [title]="content.sections.featured" [products]="featured()" />
    <app-promo-banner />
    <app-featured-products [title]="content.sections.newArrivals" [products]="newArrivals()" />

    @if (bestSellers().length > 0) {
    <app-featured-products [title]="content.sections.bestSellers" [products]="bestSellers()" badgeContext="bestseller" />
    }

    @if (brands().length > 0) {
      <app-brand-carousel [brands]="brands()" />
    }
  </div>

  <!-- FAQ Section -->
  <app-faq-section />
</div>
