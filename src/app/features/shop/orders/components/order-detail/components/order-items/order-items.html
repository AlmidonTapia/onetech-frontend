<div class="detail-section">
  <h4 class="section-title">{{ content().sections.productsTitle }}</h4>
  <div class="detail-items">
      @for (item of order().details; track item.idOrderDetail) {
      <div class="detail-item">
          <div class="item-info">
              <span class="item-name">{{ item.productName }}</span>
              <span class="item-qty">× {{ item.quantity }}</span>
          </div>
          <div class="item-prices">
              <div class="item-unit-row">
                  <span class="item-unit">{{ item.unitPrice | currencyPen }}{{ content().totals.unitSuffix }}</span>
              </div>
              <span class="item-subtotal">{{ item.subtotal | currencyPen }}</span>
          </div>
      </div>
      }
  </div>
</div>
