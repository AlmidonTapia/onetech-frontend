<p-dialog [visible]="visible" [header]="t().orders.detail.headerPrefix + (order?.idOrder?.substring(0,8)?.toUpperCase() ?? '')"
  [modal]="true" [closable]="true" [draggable]="false" [style]="{ width: '600px' }" (onHide)="close()">

  @if (order) {
  <div class="order-detail">
      <app-order-status 
          [order]="order" 
          [shipment]="shipment()" 
          [loadingShipment]="loadingShipment()" 
          [content]="t().orders.detail">
      </app-order-status>

      <app-order-items 
          [order]="order" 
          [content]="t().orders.detail">
      </app-order-items>

      <app-order-summary 
          [order]="order" 
          [content]="t().orders.detail">
      </app-order-summary>
  </div>
  }

  <ng-template pTemplate="footer">
      <app-button variant="ghost" [label]="t().orders.detail.actions.closeLabel" (clicked)="close()" />
  </ng-template>
</p-dialog>
