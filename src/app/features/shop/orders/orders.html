<div class="orders-page">
    <div class="container">

        <app-breadcrumb [items]="breadcrumb" />

        <div class="page-header">
            <h1>{{ content.title }}</h1>
            <p class="page-sub">{{ content.subtitle }}</p>
        </div>

        <app-orders-list [orders]="orders()" [loading]="loading()" (viewDetail)="openDetail($event)" />

        @if (totalRecords() > rows && !loading()) {
        <div class="paginator-wrap">
            <p-paginator [rows]="rows" [totalRecords]="totalRecords()" [first]="page() * rows"
                (onPageChange)="loadOrders($event)" />
        </div>
        }

    </div>
</div>

<app-order-detail [visible]="detailVisible()" (visibleChange)="detailVisible.set($event)" [order]="selectedOrder()" />
