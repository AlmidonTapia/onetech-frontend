<div class="py-7 pb-20">
  <div class="container">
        <app-breadcrumb [items]="breadcrumb" class="block mb-6" />

    <h1 class="text-[26px] font-bold text-slate-800 dark:text-slate-100 m-0 mb-7">
      Mi carrito
      @if (cartStore.itemCount() > 0) {
      <span class="text-[20px] text-slate-500 font-medium ml-1.5">({{ cartStore.itemCount() }})</span>
      }
    </h1>

    @if (loading) {
    <app-spinner size="md" label="Cargando carrito..." />
    }

    @else if (cartStore.itemCount() === 0) {
    <div class="flex flex-col items-center justify-center gap-5 py-20 px-6 text-center bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm">
      <i class="pi pi-shopping-cart text-[40px] text-blue-600 bg-blue-50 dark:bg-blue-900/20 w-24 h-24 rounded-full flex items-center justify-center"></i>
      <h3 class="text-[22px] font-bold text-slate-800 dark:text-slate-100 m-0">Tu carrito está vacío</h3>
      <p class="text-[15px] text-slate-500 m-0 mb-2 max-w-[320px] leading-relaxed">Agrega productos para empezar tu compra.</p>
      <app-button variant="primary" label="Explorar productos" [routerLink]="routes.catalog" />
    </div>
    }

    @else {
    <div class="flex flex-col lg:grid lg:grid-cols-[minmax(0,1fr)_380px] gap-6 lg:gap-8 items-start max-w-[1040px] mx-auto">
      <div class="min-w-0 w-full">
        <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm transition-all duration-300 hover:border-blue-500">
          <app-cart-items [items]="cartStore.cart()?.items ?? []" (updateQty)="onUpdateQty($event)"
            (removeItem)="onRemove($event)" />
        </div>
      </div>

      <div class="w-full">
        <app-cart-summary [totalAmount]="cartStore.totalAmount()" [itemCount]="cartStore.itemCount()"
          [paymentMethods]="paymentMethods"
          (checkout)="goCheckout()" />
      </div>
    </div>

    @if (relatedProducts.length > 0) {
      <div class="mt-10">
        <app-related-products [products]="relatedProducts" />
      </div>
    }
    }
  </div>
</div>
