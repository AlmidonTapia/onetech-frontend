<div class="cart-page">
  <div class="container">
        <app-breadcrumb [items]="breadcrumb" class="cart-breadcrumb" />

    <h1 class="cart-title">
      {{ content.title }}
      @if (cartStore.itemCount() > 0) {
      <span class="cart-count">({{ cartStore.itemCount() }})</span>
      }
    </h1>

    @if (loading) {
    <app-spinner size="md" [label]="content.loadingLabel" />
    }

    @else if (cartStore.itemCount() === 0) {
    <div class="cart-empty">
      <i class="pi pi-shopping-cart"></i>
      <h3>{{ content.emptyTitle }}</h3>
      <p>{{ content.emptyDescription }}</p>
      <app-button variant="primary" [label]="content.exploreBtnLabel" [routerLink]="routes.catalog" />
    </div>
    }

    @else {
    <div class="cart-layout">
      <div class="cart-main">
        <div class="cart-items-card">
          <app-cart-items [items]="cartStore.cart()?.items ?? []" (updateQty)="onUpdateQty($event)"
            (removeItem)="onRemove($event)" />
        </div>
      </div>

      <div class="cart-aside">
        <app-cart-summary [totalAmount]="cartStore.totalAmount()" [itemCount]="cartStore.itemCount()"
          (checkout)="goCheckout()" />
      </div>
    </div>

    @if (relatedProducts.length > 0) {
      <div class="cart-cross-sell" style="margin-top: 40px;">
        <app-related-products [products]="relatedProducts" />
      </div>
    }
    }
  </div>
</div>
