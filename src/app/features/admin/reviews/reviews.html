<div class="flex flex-col gap-6">
  
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">{{ content.title }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 m-0">{{ content.subtitle }}</p>
    </div>
  </div>

  <app-reviews-table 
    [reviews]="reviews()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [content]="content"
    (lazyLoad)="loadReviews($event)"
    (onApprove)="onApprove($event)"
    (onReject)="onReject($event)"
    (onDelete)="onDelete($event)"
    (search)="onSearch($event)"
    (filterChange)="onFilterChange($event)"
  />

</div>
