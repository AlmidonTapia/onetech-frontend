<div class="flex flex-col gap-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">{{ content.title }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-0">{{ methods().length }}{{ content.badgeSuffix }}</p>
    </div>
    <app-button variant="primary" [label]="content.newBtnLabel" [icon]="content.newBtnIcon" (clicked)="openCreate()" />
  </div>

  <app-shipments-method-table
    [methods]="methods()"
    [loading]="loading()"
    [content]="content"
    (onEdit)="openEdit($event)"
    (onDelete)="onDelete($event)"
    (search)="onSearch($event)">
  </app-shipments-method-table>
</div>

<app-shipment-method-form
  [visible]="formVisible()"
  [isEditing]="editingMethod() !== null"
  [formGroup]="form"
  [saving]="saving()"
  [content]="content"
  [statuses]="statuses"
  (onClose)="formVisible.set(false)"
  (onSave)="onSave()">
</app-shipment-method-form>
