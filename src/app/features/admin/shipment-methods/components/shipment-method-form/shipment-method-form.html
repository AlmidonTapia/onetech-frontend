<p-dialog [visible]="visible()" (visibleChange)="!$event && close()" [header]="isEditing() ? content().dialog.editTitle : content().dialog.createTitle" [style]="{width: '400px'}" [modal]="true">
  <form [formGroup]="formGroup()" (ngSubmit)="submit()" class="flex flex-col gap-6 py-2">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-semibold text-slate-800 dark:text-slate-100">{{ content().dialog.fields.name }}</label>
        <input type="text" formControlName="methodName" class="w-full h-[42px] border border-slate-200 dark:border-slate-700 rounded-md bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 px-3 text-sm outline-none focus:border-blue-500 transition-colors" [placeholder]="content().dialog.fields.namePlaceholder" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-semibold text-slate-800 dark:text-slate-100">{{ content().dialog.fields.price }}</label>
        <input type="number" formControlName="basePrice" class="w-full h-[42px] border border-slate-200 dark:border-slate-700 rounded-md bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 px-3 text-sm outline-none focus:border-blue-500 transition-colors" />
      </div>
      <div class="flex flex-col gap-1.5" *ngIf="isEditing()">
        <label class="text-[13px] font-semibold text-slate-800 dark:text-slate-100">{{ content().dialog.fields.status }}</label>
        <p-select formControlName="status" [options]="statuses()" optionLabel="label" optionValue="value" [placeholder]="content().dialog.fields.statusPlaceholder" [style]="{width: '100%'}" appendTo="body"></p-select>
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <app-button variant="outline" [label]="content().dialog.actions.cancel" type="button" (clicked)="close()" />
      <app-button variant="primary" [label]="content().dialog.actions.save" type="submit" [loading]="saving()" [disabled]="formGroup().invalid" />
    </div>
  </form>
</p-dialog>
