<div class="admin-page">

  <div class="page-header">
    <div class="page-title">
      <h1>{{ content.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ content.countSuffix }}</p>
    </div>
  </div>

  <app-card [padding]="content.cardPadding">
    <app-users-table [users]="users()" [totalRecords]="totalRecords()" [loading]="loading()"
      (lazyLoad)="loadUsers($event)" />
  </app-card>

</div>
