<div class="flex flex-col gap-6">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">Usuarios</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 m-0">{{ totalRecords() }} usuarios registrados</p>
    </div>
  </div>

  <app-users-table 
    [users]="users()" 
    [totalRecords]="totalRecords()" 
    [loading]="loading()"
    (lazyLoad)="loadUsers($event)"
    (search)="onSearch($event)"
    (filterChange)="onFilterChange($event)">
  </app-users-table>
</div>
