<div class="flex flex-col gap-8">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight m-0">Productos</h1>
      <p class="text-[15px] text-slate-500 dark:text-slate-400 mt-2 m-0">{{ totalRecords() }} productos registrados</p>
    </div>
    <app-button label="Nuevo producto" icon="pi pi-plus" (clicked)="openCreate()" />
  </div>

  <div class="flex items-center justify-end gap-4 p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
    <app-button variant="ghost" icon="pi pi-refresh" label="Actualizar"
      (clicked)="loadProducts()" />
  </div>

  <app-products-table
    [products]="products()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [categories]="categories()"
    [brands]="brands()"
    (lazyLoad)="loadProducts($event)"
    (editItem)="openEdit($event)"
    (deleteItem)="onDelete($event)"
    (manageImages)="openImages($event)"
    (search)="onSearch($event)"
    (filterChange)="onFilterChange($event)"
  />
</div>

<app-product-form [(visible)]="formVisible" [product]="editingProduct()" [saving]="saving()" (save)="onSave($event)"
  (cancel)="formVisible.set(false)" />

<app-product-images-manager [(visible)]="imagesVisible" [product]="editingProduct()" (updated)="loadProducts()" />
