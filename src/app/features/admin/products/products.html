<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ t().adminProducts.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ t().adminProducts.countSuffix }}</p>
    </div>
    <app-button [label]="t().adminProducts.createBtnLabel" icon="pi pi-plus" (clicked)="openCreate()" />
  </div>

  <div class="table-toolbar" style="display: flex; justify-content: flex-end;">
    <app-button variant="ghost" icon="pi pi-refresh" [label]="t().adminProducts.refreshBtnLabel"
      (clicked)="loadProducts()" />
  </div>

    <app-products-table
      [products]="products()"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      [categories]="categories()"
      [brands]="brands()"
      (lazyLoad)="loadProducts($event)"
      (editItem)="openEdit($event)"
      (deleteItem)="onDelete($event)"
      (manageImages)="openImages($event)"
      (search)="onSearch($event)"
      (filterChange)="onFilterChange($event)"
    />

</div>

<app-product-form [(visible)]="formVisible" [product]="editingProduct()" [saving]="saving()" (save)="onSave($event)"
  (cancel)="formVisible.set(false)" />

<app-product-images-manager [(visible)]="imagesVisible" [product]="editingProduct()" (updated)="loadProducts()" />
