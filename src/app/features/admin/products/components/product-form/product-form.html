<p-dialog [visible]="visible" [header]="title" [modal]="true" [closable]="true" [draggable]="false"
  [style]="{ width: content.dialogWidth }" (onHide)="onCancel()">

  <form [formGroup]="form" class="product-form" novalidate>
    @for (row of formConfig; track $index) {
    <div class="form-row">
      @for (field of row; track field.name) {
      <div class="form-field" [style.flex]="field.flex || '1'">
        <label>{{ field.label }}</label>

        @if (field.type === 'text') {
        <input pInputText [formControlName]="field.name" [placeholder]="field.placeholder"
          [class.ng-invalid]="isInvalid(field.name)" [class.ng-dirty]="isInvalid(field.name)" />
        }

        @else if (field.type === 'textarea') {
        <textarea pTextarea [formControlName]="field.name" rows="3" [placeholder]="field.placeholder"
          [class.ng-invalid]="isInvalid(field.name)">
                    </textarea>
        }

        @else if (field.type === 'select') {
        <p-select [formControlName]="field.name" [options]="getOptions(field.optionsKey)"
          [optionLabel]="field.optionLabel" [optionValue]="field.optionValue" [placeholder]="field.placeholder"
          [style]="{ 'width': content.styles.selectWidth }" [appendTo]="content.styles.appendTo" />
        }

        @else if (field.type === 'number') {
        <p-inputNumber [formControlName]="field.name" [min]="field.min"
          [minFractionDigits]="field.minFractionDigits || 0" [mode]="field.mode || 'decimal'"
          [style]="{ 'width': content.styles.selectWidth }" />
        }

        @if (isInvalid(field.name)) {
        <span class="field-error">{{ content.errorRequired }}</span>
        }
      </div>
      }
    </div>
    }
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <app-button variant="ghost" [label]="content.actions.cancelLabel" (clicked)="onCancel()" />
      <app-button variant="primary" [label]="content.actions.saveLabel" [icon]="content.actions.saveIcon"
        [loading]="saving" (clicked)="onSave()" />
    </div>
  </ng-template>
</p-dialog>
