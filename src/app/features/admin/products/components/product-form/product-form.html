<p-dialog [visible]="visible" [header]="title" [modal]="true" [closable]="true" [draggable]="false"
    [style]="{ width: '600px' }" (onHide)="onCancel()">

    <form [formGroup]="form" class="product-form">
        @for (row of formConfig; track $index) {
          <div class="form-row">
            @for (field of row; track field.name) {
              <div class="form-field" [style.flex]="field.flex || '1'">
                  <label>{{ field.label }}</label>
                  
                  @if (field.type === 'text') {
                    <input pInputText [formControlName]="field.name" [placeholder]="field.placeholder" />
                  } @else if (field.type === 'textarea') {
                    <textarea pTextarea [formControlName]="field.name" rows="3" [placeholder]="field.placeholder"></textarea>
                  } @else if (field.type === 'select') {
                    <p-select [formControlName]="field.name" [options]="getOptions(field.optionsKey)" [optionLabel]="field.optionLabel" [optionValue]="field.optionValue" [placeholder]="field.placeholder" [style]="{'width':'100%'}" [appendTo]="'body'" />
                  } @else if (field.type === 'number') {
                    <p-inputNumber [formControlName]="field.name" [min]="field.min" [minFractionDigits]="field.minFractionDigits || 0" [mode]="field.mode || 'decimal'" [style]="{'width':'100%'}" />
                  }

                  @if (isInvalid(field.name)) {
                  <span class="field-error">Campo requerido</span>
                  }
              </div>
            }
          </div>
        }
    </form>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <app-button variant="ghost" label="Cancelar" (clicked)="onCancel()" />
            <app-button variant="primary" label="Guardar" icon="pi-check" [loading]="saving" (clicked)="onSave()" />
        </div>
    </ng-template>
</p-dialog>
