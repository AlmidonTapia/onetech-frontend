<p-table [value]="products" [loading]="loading" [paginator]="true" [rows]="rows" [totalRecords]="totalRecords"
    [lazy]="true" (onLazyLoad)="lazyLoad.emit($event)" [rowHover]="true" styleClass="p-datatable-sm"
    [tableStyle]="{'min-width':'860px'}">

    <ng-template pTemplate="header">
        <tr>
            <th style="width:56px">Img</th>
            <th>Producto</th>
            <th style="width:110px">SKU</th>
            <th>Categoría</th>
            <th>Marca</th>
            <th style="width:110px">Precio</th>
            <th style="width:80px">Stock</th>
            <th style="width:110px">Acciones</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-p>
        <tr>
            <td>
                <div class="thumb">
                    @if (p.images?.[0]?.imageUrl) {
                    <img [src]="p.images[0].imageUrl" [alt]="p.productName" />
                    } @else {
                    <i class="pi pi-image"></i>
                    }
                </div>
            </td>
            <td><span class="p-name">{{ p.productName }}</span></td>
            <td><code class="sku">{{ p.sku }}</code></td>
            <td>{{ p.categoryName }}</td>
            <td>{{ p.brandName }}</td>
            <td class="price">{{ p.price | currencyPen }}</td>
            <td>
                <app-badge [variant]="p.stockQuantity > 0 ? 'success' : 'error'">
                    {{ p.stockQuantity }}
                </app-badge>
            </td>
            <td>
                <div class="row-actions">
                    <button class="act-btn" pTooltip="Imágenes" (click)="manageImages.emit(p)">
                        <i class="pi pi-images"></i>
                    </button>
                    <button class="act-btn" pTooltip="Editar" (click)="editItem.emit(p)">
                        <i class="pi pi-pencil"></i>
                    </button>
                    <button class="act-btn act-btn--danger" pTooltip="Eliminar" (click)="deleteItem.emit(p)">
                        <i class="pi pi-trash"></i>
                    </button>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="8" class="empty-cell">No se encontraron productos.</td>
        </tr>
    </ng-template>
</p-table>
