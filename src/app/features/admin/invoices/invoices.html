<div class="flex flex-col gap-6 w-full">
  <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-6 md:px-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 dark:text-slate-100 m-0">{{ content.title }}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-0">{{ totalRecords() }}{{ content.badgeSuffix }}</p>
    </div>
  </div>

  <app-invoices-table
    [invoices]="invoices()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [content]="content"
    (lazyLoad)="loadInvoices($event)"
    (onDownload)="onDownload($event)"
    (onSendEmail)="onSendEmail($event)"
    (onAnnul)="onAnnul($event)">
  </app-invoices-table>
</div>
