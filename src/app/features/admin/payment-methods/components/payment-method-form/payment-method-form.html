<p-dialog [visible]="visible()" (visibleChange)="!$event && close()" [header]="isEditing() ? content().form.titleEdit : content().form.titleNew" [style]="{width: '400px'}" [modal]="true">
  <form [formGroup]="formGroup()" (ngSubmit)="submit()" class="modal-form">
    <div class="form-grid">
      <div class="form-group">
        <label>{{ content().form.labels.name }}</label>
        <input type="text" formControlName="methodName" class="form-input" [placeholder]="content().form.placeholders.name" />
      </div>
      <div class="form-group" *ngIf="isEditing()">
        <label>{{ content().form.labels.status }}</label>
        <select formControlName="status" class="form-select">
          <option value="ACTIVO">{{ content().form.statusOptions.active }}</option>
          <option value="INACTIVO">{{ content().form.statusOptions.inactive }}</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <app-button variant="outline" [label]="content().form.buttons.cancel" type="button" (clicked)="close()" />
      <app-button variant="primary" [label]="content().form.buttons.save" type="submit" [loading]="saving()" [disabled]="formGroup().invalid" />
    </div>
  </form>
</p-dialog>
