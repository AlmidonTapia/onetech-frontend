<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ content.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ content.countSuffix }}</p>
    </div>
    <app-button variant="primary" [label]="content.createBtnLabel" [icon]="content.createBtnIcon" (clicked)="openCreate()" />
  </div>

  <app-coupons-table
    [coupons]="coupons()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (lazyLoad)="loadCoupons($event)"
    (editItem)="openEdit($event)"
    (deleteItem)="onDelete($event)"
    (search)="onSearch($event)"
    (filterChange)="onFilterChange($event)" />
</div>

<app-coupon-form
  [visible]="formVisible()"
  (visibleChange)="formVisible.set($event)"
  [coupon]="editingCoupon()"
  [saving]="saving()"
  (save)="onSave($event)"
  (cancel)="formVisible.set(false)" />
