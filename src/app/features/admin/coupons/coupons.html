<div class="flex flex-col gap-6">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">Cupones</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 m-0">{{ totalRecords() }} cupones registrados</p>
    </div>
    <app-button variant="primary" label="Nuevo Cupón" icon="pi-plus" (clicked)="openCreate()" />
  </div>

  <app-coupons-table
    [coupons]="coupons()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (lazyLoad)="loadCoupons($event)"
    (editItem)="openEdit($event)"
    (deleteItem)="onDelete($event)"
    (search)="onSearch($event)"
    (filterChange)="onFilterChange($event)" />
</div>

<app-coupon-form
  [visible]="formVisible()"
  (visibleChange)="formVisible.set($event)"
  [coupon]="editingCoupon()"
  [saving]="saving()"
  (save)="onSave($event)"
  (cancel)="formVisible.set(false)" />
