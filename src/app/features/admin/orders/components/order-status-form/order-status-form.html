<p-dialog [visible]="visible" [header]="content.headerTitle" [modal]="true" [closable]="true" [draggable]="false"
    [style]="{ width: content.dialogWidth }" (onHide)="onCancel()">

    @if (order) {
    <div class="order-summary">
        <div class="summary-row">
            <span class="summary-label">{{ content.labels.order }}</span>
            <code>{{ content.idPrefix }}{{ order.idOrder.substring(0, 8) }}</code>
        </div>
        <div class="summary-row">
            <span class="summary-label">{{ content.labels.client }}</span>
            <span>{{ order.userFullName }}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">{{ content.labels.total }}</span>
            <strong>{{ order.totalAmount | currencyPen }}</strong>
        </div>
    </div>
    }

    <form [formGroup]="form" class="simple-form" novalidate>
        <div class="form-field">
            <label>{{ content.labels.newStatus }}</label>
            <p-select formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value"
                [placeholder]="content.placeholderSelect" [style]="{ 'width': content.styles.selectWidth }" />
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <app-button variant="ghost" [label]="content.actions.cancelLabel" (clicked)="onCancel()" />
            <app-button variant="primary" [label]="content.actions.saveLabel" [icon]="content.actions.saveIcon"
                [loading]="saving" (clicked)="onSave()" />
        </div>
    </ng-template>
</p-dialog>
