<div class="page-container">

    <div class="page-header">
        <div>
      <h1 class="page-title">{{ content.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ content.countSuffix }}</p>
    </div>
    </div>

    
        <app-orders-table 
            [orders]="orders()" 
            [totalRecords]="totalRecords()" 
            [loading]="loading()"
            (lazyLoad)="loadOrders($event)" 
            (changeStatus)="openStatus($event)" 
            (viewDetail)="openDetail($event)"
            (search)="onSearch($event)" 
            (filterStatus)="onFilterStatus($event)" />
    

</div>

<app-order-status-form [(visible)]="statusVisible" [order]="editingOrder()" [saving]="saving()"
    (save)="onStatusSave($event)" (cancel)="statusVisible.set(false)" />
