<div class="page-container">

    <div class="page-header">
        <div>
      <h1 class="page-title">{{ t().adminOrders.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ t().adminOrders.countSuffix }}</p>
    </div>
    </div>

    
        <app-orders-table 
            [orders]="orders()" 
            [totalRecords]="totalRecords()" 
            [loading]="loading()"
            (lazyLoad)="loadOrders($event)" 
            (changeStatus)="openStatus($event)" 
            (viewDetail)="openDetail($event)"
            (search)="onSearch($event)" 
            (filterStatus)="onFilterStatus($event)" />
    

</div>

<app-order-status-form [(visible)]="statusVisible" [order]="editingOrder()" [saving]="saving()"
    (save)="onStatusSave($event)" (cancel)="statusVisible.set(false)" />

<app-order-details-modal 
  [visible]="showDetailsModal()"
  [order]="selectedOrder()"
  [shipment]="selectedShipment()"
  [invoice]="selectedInvoice()"
  (onClose)="showDetailsModal.set(false)"
  (onDownloadInvoice)="downloadInvoice($event)">
</app-order-details-modal>
