<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
  @for (stat of stats; track stat.label) {
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-5 flex items-center gap-4 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 animate-fade-in">

    <div class="w-[52px] h-[52px] rounded-xl flex items-center justify-center shrink-0"
         [ngClass]="{
           'bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400': stat.color === 'blue',
           'bg-orange-100 text-orange-600 dark:bg-orange-500/15 dark:text-orange-400': stat.color === 'orange',
           'bg-green-100 text-green-600 dark:bg-green-500/15 dark:text-green-400': stat.color === 'green',
           'bg-purple-100 text-purple-600 dark:bg-purple-500/15 dark:text-purple-400': stat.color === 'purple'
         }">
      <i class="pi text-[22px]" [ngClass]="stat.icon"></i>
    </div>

    <div class="flex flex-col">
      <span class="text-[28px] font-bold text-slate-800 dark:text-slate-100 leading-[1.1]">{{ stat.value }}</span>
      <span class="text-[13px] font-semibold text-slate-800 dark:text-slate-100 mt-1">{{ stat.label }}</span>
      <span class="text-xs text-slate-500 dark:text-slate-400">{{ stat.suffix }}</span>
    </div>

  </div>
  }
</div>
