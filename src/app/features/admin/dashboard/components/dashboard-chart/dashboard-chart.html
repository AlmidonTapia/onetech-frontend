<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">Órdenes por estado</h3>
    <span class="chart-subtitle">últimas 10 órdenes</span>
  </div>
  @if (data) {
  <div class="chart-body">
    <p-chart type="doughnut" [data]="data" [options]="chartOptions" height="240" />
  </div>
  } @else {
  <div class="chart-empty">Sin datos disponibles</div>
  }
</div>
