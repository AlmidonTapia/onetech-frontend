<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">{{ content.title }}</h3>
    <span class="chart-subtitle">{{ content.subtitle }}</span>
  </div>

  @if (data) {
  <div class="chart-body">
    <p-chart [type]="content.chartType" [data]="data" [options]="chartOptions" [height]="content.chartHeight" />
  </div>
  }

  @else {
  <div class="chart-empty">
    {{ content.emptyMessage }}
  </div>
  }
</div>
