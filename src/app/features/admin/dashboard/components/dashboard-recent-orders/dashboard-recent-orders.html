<div class="recent-card">
  <div class="recent-header">
    <h3 class="recent-title">Órdenes recientes</h3>
    <a routerLink="/admin/orders" class="view-all">Ver todas →</a>
  </div>

  <div class="recent-body">
    @if (orders.length === 0) {
    <p class="recent-empty">No hay órdenes recientes.</p>
    } @else {
    @for (order of orders; track order.id) {
    <div class="order-row">
      <div class="order-info">
        <span class="order-id">#{{ order.id.substring(0, 8) }}</span>
        <span class="order-user">{{ order.userFullName }}</span>
      </div>
      <div class="order-meta">
        <span class="order-total">{{ order.totalAmount | currencyPen }}</span>
        <p-tag [value]="getStatusLabel(order.status)" [severity]="getStatusSeverity(order.status)" />
      </div>
    </div>
    }
    }
  </div>
</div>
