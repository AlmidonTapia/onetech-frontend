<div class="admin-page">

  <div class="page-header">
    <div class="page-title">
      <h1>{{ content.title }}</h1>
      <p class="page-subtitle">{{ content.subtitle }}</p>
    </div>
  </div>

  @if (loading()) {
  <app-spinner size="lg" [label]="content.loadingLabel" />
  } @else {
  <app-dashboard-stats [stats]="stats()" />

  <div class="dashboard-grid">
    <app-dashboard-chart [data]="chartData()" />
    <app-dashboard-recent-orders [orders]="recentOrders()" />
  </div>
  }

</div>
