<div class="flex flex-col gap-8">
  <div class="flex items-start justify-between">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight m-0">Dashboard</h1>
      <p class="text-[15px] text-slate-500 dark:text-slate-400 mt-2 m-0">Resumen general del negocio</p>
    </div>
  </div>

  @if (loading()) {
  <app-spinner size="lg" label="Cargando datos..." />
  } @else {
  <app-dashboard-stats [stats]="stats()" />

  <div class="grid grid-cols-1 lg:grid-cols-[1fr_1.6fr] gap-6">
    <app-dashboard-chart [data]="chartData()" />
    <app-dashboard-recent-orders [orders]="recentOrders()" />
  </div>
  }

</div>
