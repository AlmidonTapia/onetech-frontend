<div class="page-container">

  <div class="page-header">
    <div>
      <h1 class="page-title">{{ t().adminDashboard.title }}</h1>
      <p class="page-subtitle">{{ t().adminDashboard.subtitle }}</p>
    </div>
  </div>

  @if (loading()) {
  <app-spinner size="lg" [label]="t().adminDashboard.loadingLabel" />
  } @else {
  <app-dashboard-stats [stats]="stats()" />

  <div class="dashboard-grid">
    <app-dashboard-chart [data]="chartData()" />
    <app-dashboard-recent-orders [orders]="recentOrders()" />
  </div>
  }

</div>
