<p-table [value]="brands" [loading]="loading" [paginator]="true" [rows]="tableConfig.defaultRows"
    [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="lazyLoad.emit($event)" [rowHover]="true"
    styleClass="p-datatable-sm">

    <ng-template pTemplate="caption">
        <div class="table-header-container">
            <h5 class="table-header-title">{{ content.quickSearchTitle }}</h5>
            <span class="p-input-icon-left search-input-wrapper">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="onSearch($event)" [placeholder]="content.searchPlaceholder" class="filter-search-input"/>
            </span>
        </div>
    </ng-template>

    <!-- Encabezados de la Tabla -->
    <ng-template pTemplate="header">
        <tr>
            <th>{{ content.headers.brand }}</th>
            <th [style.width]="tableConfig.actionsWidth">{{ content.headers.actions }}</th>
        </tr>
    </ng-template>

    <!-- Cuerpo de Datos Dinámicos -->
    <ng-template pTemplate="body" let-brand>
        <tr>
            <td>
                <div class="brand-cell" style="display: flex; align-items: center; gap: 12px;">
                    @if (brand.imageUrl) {
                        <img [src]="brand.imageUrl" [alt]="brand.brandName" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--ot-border-color);" />
                    } @else {
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--ot-bg-subtle); display: flex; align-items: center; justify-content: center; color: var(--ot-text-muted);">
                            <i class="pi pi-image"></i>
                        </div>
                    }
                    <span class="brand-name">{{ brand.brandName }}</span>
                </div>
            </td>
            <td>
                <div class="row-actions">
                    <!-- Botón de Edición -->
                    <button class="act-btn" [pTooltip]="content.tooltips.edit" (click)="editItem.emit(brand)">
                        <i [class]="content.icons.edit"></i>
                    </button>
                    <!-- Botón de Eliminación -->
                    <button class="act-btn act-btn--danger" [pTooltip]="content.tooltips.delete"
                        (click)="deleteItem.emit(brand)">
                        <i [class]="content.icons.delete"></i>
                    </button>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td [attr.colspan]="tableConfig.colspanEmpty" class="table-empty-state">
                <i class="pi pi-inbox table-empty-icon"></i>
                <p class="table-empty-text">{{ content.emptyMessage }}</p>
            </td>
        </tr>
    </ng-template>

</p-table>
