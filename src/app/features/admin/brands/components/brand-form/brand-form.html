<p-dialog [visible]="visible" [header]="title" [modal]="true" [closable]="true" [draggable]="false"
  [style]="{ width: content.dialogWidth }" (onHide)="onCancel()">

  <form [formGroup]="form" class="simple-form" novalidate>
    @for (row of formConfig; track $index) {
    <div class="form-row">
      @for (field of row; track field.name) {
      <div class="form-field" [style.flex]="field.flex || '1'">
        <label>{{ field.label }}</label>

        @if (field.type === 'text') {
        <input pInputText [formControlName]="field.name" [placeholder]="field.placeholder"
          [class.ng-invalid]="isInvalid(field.name)" [class.ng-dirty]="isInvalid(field.name)" />
        }

        @if (isInvalid(field.name)) {
        <span class="field-error">{{ content.errorRequired }}</span>
        }
      </div>
      }
    </div>
    }
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <app-button variant="ghost" [label]="content.actions.cancelLabel" (clicked)="onCancel()" />
      <app-button variant="primary" [label]="content.actions.saveLabel" [icon]="content.actions.saveIcon"
        [loading]="saving" (clicked)="onSave()" />
    </div>
  </ng-template>
</p-dialog>
