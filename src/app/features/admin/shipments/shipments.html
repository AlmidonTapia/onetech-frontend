<div class="flex flex-col gap-6">

  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">Envíos</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-0">{{ totalRecords() }} envíos registrados</p>
    </div>
    <app-button label="Nuevo envío" icon="pi-plus" (clicked)="openCreate()" />
  </div>

  <app-shipments-table [shipments]="shipments()" [totalRecords]="totalRecords()"
    (lazyLoad)="loadShipments($event)"
    (onEdit)="openEdit($event)"
    (search)="onSearch($event)">
  </app-shipments-table>

</div>

<app-shipment-form [(visible)]="formVisible" [shipment]="editingShipment()" [saving]="saving()"
  (save)="onCreate($event)" (dispatch)="onDispatch($event)" (updateStatus)="onUpdateStatus($event)" (cancel)="formVisible.set(false)" />
