<div class="page-container">

  <div class="page-header">
    <div>
      <h1 class="page-title">{{ t().adminShipments.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ t().adminShipments.countSuffix }}</p>
    </div>
    <app-button [label]="t().adminShipments.createBtnLabel" icon="pi-plus" (clicked)="openCreate()" />
  </div>

  <app-shipments-table [shipments]="shipments()" [totalRecords]="totalRecords()"
    (lazyLoad)="loadShipments($event)"
    (onEdit)="openEdit($event)"
    (search)="onSearch($event)">
  </app-shipments-table>

</div>

<app-shipment-form [(visible)]="formVisible" [shipment]="editingShipment()" [saving]="saving()"
  (save)="onCreate($event)" (dispatch)="onDispatch($event)" (updateStatus)="onUpdateStatus($event)" (cancel)="formVisible.set(false)" />
