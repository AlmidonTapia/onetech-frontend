<div class="page-container">

  <div class="page-header">
    <div>
      <h1 class="page-title">{{ content.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ content.countSuffix }}</p>
    </div>
    <app-button [label]="content.createBtnLabel" [icon]="content.createBtnIcon" (clicked)="openCreate()" />
  </div>

  
    <app-shipments-table [shipments]="shipments()" [totalRecords]="totalRecords()"
    (lazyLoad)="loadShipments($event)"
    (onEdit)="openEdit($event)"
    (search)="onSearch($event)">
  </app-shipments-table>
  

</div>

<app-shipment-form [(visible)]="formVisible" [shipment]="editingShipment()" [saving]="saving()"
  (save)="onCreate($event)" (updateStatus)="onUpdateStatus($event)" (cancel)="formVisible.set(false)" />
