<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ t().adminShipping.title }}</h1>
      <p class="page-subtitle">{{ t().adminShipping.description }}</p>
    </div>
  </div>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">
        <i class="pi pi-compass mr-2"></i> {{ t().adminShipping.tabs.agencies }}
      </p-tab>
      <p-tab value="1">
        <i class="pi pi-map mr-2"></i> {{ t().adminShipping.tabs.rates }}
      </p-tab>
      <p-tab value="2">
        <i class="pi pi-map-marker mr-2"></i> {{ t().adminShipping.tabs.locations }}
      </p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <div style="padding-top: 16px;">
          <app-agencies-table />
        </div>
      </p-tabpanel>
      <p-tabpanel value="1">
        <div style="padding-top: 16px;">
          <app-rates-table />
        </div>
      </p-tabpanel>
      <p-tabpanel value="2">
        <div style="padding-top: 16px;">
          <app-locations-table />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
