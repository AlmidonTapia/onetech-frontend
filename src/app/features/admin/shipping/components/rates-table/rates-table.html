<div class="table-toolbar" style="margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px; user-select: none; cursor: default;">
      <h2 style="margin: 0; font-size: 1.125rem; font-weight: 600; color: var(--ot-text-main);">Tarifas y Coberturas</h2>
      <span style="background: var(--ot-bg-surface); border: 1px solid var(--ot-border-color); color: var(--ot-text-muted); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">{{ rates().length }} tarifas</span>
    </div>
    <app-button label="Nueva Tarifa" icon="pi pi-plus" (clicked)="openCreate()"></app-button>
</div>

  <p-table [value]="rates()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>Agencia</th>
        <th>Zona / Ubigeo</th>
        <th>Costo Adicional</th>
        <th>Estado</th>
        <th style="width: 100px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rate>
      <tr>
        <td>{{ rate.methodName }}</td>
        <td>{{ getUbigeoDescription(rate) }}</td>
        <td>{{ rate.cost | currencyPen }}</td>
        <td>
          <p-tag [severity]="rate.isAvailable ? 'success' : 'danger'" 
                 [value]="rate.isAvailable ? 'Disponible' : 'No Disponible'"></p-tag>
        </td>
        <td style="text-align: center;">
          <div class="row-actions">
            <button class="act-btn" (click)="openEdit(rate)" title="Editar">
              <i class="pi pi-pencil"></i>
            </button>
            <button class="act-btn act-btn--danger" (click)="delete(rate)" title="Eliminar">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="table-empty-state">
        <i class="pi pi-inbox table-empty-icon"></i>
        <p class="table-empty-text">No hay tarifas registradas aún.</p>
      </td>
    </tr>
  </ng-template>
  </p-table>


<p-dialog [header]="isEdit() ? 'Editar Tarifa' : 'Nueva Tarifa'" [visible]="showDialog()" (visibleChange)="showDialog.set($event)"
          [modal]="true" [style]="{width: '500px'}" [draggable]="false" [resizable]="false">
  
  <form [formGroup]="form" class="simple-form mt-4">
    
    <div class="form-field">
      <label>Agencia de Envío *</label>
      <p-select [options]="agencies()" formControlName="idShipmentMethod" optionLabel="methodName" optionValue="idShipmentMethod" placeholder="Seleccione una agencia" styleClass="w-full"></p-select>
      <small class="text-red-500" *ngIf="form.get('idShipmentMethod')?.touched && form.get('idShipmentMethod')?.invalid">Requerido</small>
    </div>

    <div class="form-field">
      <label>Departamento (Opcional)</label>
      <p-select [options]="departments()" formControlName="idDepartment" optionLabel="name" optionValue="code" placeholder="Todo el país" [showClear]="true" styleClass="w-full"></p-select>
    </div>

    <div class="form-field">
      <label>Provincia (Opcional)</label>
      <p-select [options]="provinces()" formControlName="idProvince" optionLabel="name" optionValue="code" placeholder="Todo el departamento" [showClear]="true" styleClass="w-full"></p-select>
    </div>

    <div class="form-field">
      <label>Distrito (Opcional)</label>
      <p-select [options]="districts()" formControlName="idDistrict" optionLabel="name" optionValue="code" placeholder="Toda la provincia" [showClear]="true" styleClass="w-full"></p-select>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label>Costo Adicional *</label>
        <p-inputNumber formControlName="cost" mode="currency" currency="PEN" [min]="0" styleClass="w-full"></p-inputNumber>
      </div>

      <div class="form-field" style="flex-direction: row !important; align-items: center; justify-content: flex-start; padding-top: 24px;">
        <p-checkbox formControlName="isAvailable" [binary]="true"></p-checkbox>
        <label style="margin-top: 2px;">Disponible</label>
      </div>
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <app-button label="Cancelar" variant="outline" (clicked)="showDialog.set(false)"></app-button>
      <app-button label="Guardar" (clicked)="save()" [loading]="submitting()"></app-button>
    </div>
  </ng-template>
</p-dialog>
