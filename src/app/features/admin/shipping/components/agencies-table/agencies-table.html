<div class="flex justify-between items-center mb-4 flex-wrap gap-4">
  <div class="flex items-center gap-3 select-none cursor-default">
    <h2 class="m-0 text-lg font-semibold text-slate-800 dark:text-slate-100">{{ content.title }}</h2>
    <span class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded-full text-xs font-semibold">{{ methods().length }}{{ content.badgeSuffix }}</span>
  </div>
  <app-button variant="primary" [label]="content.newBtnLabel" [icon]="content.newBtnIcon" (clicked)="openCreate()" />
</div>
<app-shipments-method-table
  [methods]="methods()"
  [loading]="loading()"
  [content]="content"
  (onEdit)="openEdit($event)"
  (onDelete)="onDelete($event)"
  (search)="onSearch($event)">
</app-shipments-method-table>


<app-shipment-method-form
  [visible]="formVisible()"
  [isEditing]="editingMethod() !== null"
  [formGroup]="form"
  [saving]="saving()"
  [content]="content"
  [statuses]="statuses"
  (onClose)="formVisible.set(false)"
  (onSave)="onSave()">
</app-shipment-method-form>
