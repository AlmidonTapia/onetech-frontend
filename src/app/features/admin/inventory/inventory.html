<div class="page-container">
    <div class="page-header">
        <div>
      <h1 class="page-title">{{ t().adminInventory.title }}</h1>
      <p class="page-subtitle">{{ totalRecords() }} {{ t().adminInventory.countSuffix }}</p>
    </div>
        <app-button [label]="t().adminInventory.createBtnLabel" icon="pi-plus" (clicked)="formVisible.set(true)" />
    </div>

    
        <app-inventory-table [movements]="movements()" [totalRecords]="totalRecords()" [loading]="loading()"
            (lazyLoad)="loadMovements($event)"
            (onCancel)="onCancel($event)"
            (search)="onSearch($event)"
            (filterType)="onFilterType($event)">
        </app-inventory-table>
    
</div>

<app-movement-form [(visible)]="formVisible" [saving]="saving()" (save)="onSave($event)"
    (cancel)="formVisible.set(false)" />
