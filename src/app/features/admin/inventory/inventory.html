<div class="flex flex-col gap-6">
    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 m-0">Inventario</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 m-0">{{ totalRecords() }} movimientos registrados</p>
        </div>
        <app-button label="Registrar movimiento" icon="pi-plus" (clicked)="formVisible.set(true)" />
    </div>

    <app-inventory-table [movements]="movements()" [totalRecords]="totalRecords()" [loading]="loading()"
        (lazyLoad)="loadMovements($event)"
        (onCancel)="onCancel($event)"
        (search)="onSearch($event)"
        (filterType)="onFilterType($event)">
    </app-inventory-table>
</div>

<app-movement-form [(visible)]="formVisible" [saving]="saving()" (save)="onSave($event)"
    (cancel)="formVisible.set(false)" />
