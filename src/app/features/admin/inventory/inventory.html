<div class="admin-page">
    <div class="page-header">
        <div class="page-title">
            <h1>{{ content.title }}</h1>
            <p class="page-subtitle">{{ totalRecords() }} {{ content.countSuffix }}</p>
        </div>
        <app-button [label]="content.createBtnLabel" [icon]="content.createBtnIcon" (clicked)="formVisible.set(true)" />
    </div>

    <app-card [padding]="content.cardPadding">
        <app-inventory-table [movements]="movements()" [totalRecords]="totalRecords()" [loading]="loading()"
            (lazyLoad)="loadMovements($event)" (cancel)="onCancel($event)" />
    </app-card>
</div>

<app-movement-form [(visible)]="formVisible" [saving]="saving()" (save)="onSave($event)"
    (cancel)="formVisible.set(false)" />
