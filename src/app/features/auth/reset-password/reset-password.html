<app-auth-layout [brandData]="brandData">
  <div class="w-full max-w-[460px] flex flex-col gap-7 bg-slate-50 dark:bg-slate-900 p-8 sm:p-10 rounded-2xl sm:rounded-[24px] shadow-lg border border-slate-200 dark:border-slate-700 transition-all duration-300 animate-fade-scale">
    <div class="flex flex-col">
      <h1 class="font-sans text-[32px] font-extrabold bg-gradient-to-br from-blue-600 to-blue-500 bg-clip-text text-transparent m-0 mb-2 tracking-tight">Restablecer Contraseña</h1>
      <p class="m-0 text-slate-500 dark:text-slate-400">Ingresa tu nueva contraseña a continuación.</p>
    </div>

    @if (errorMsg()) {
    <app-alert type="error" [closeable]="true" (closed)="errorMsg.set('')">
      {{ errorMsg() }}
    </app-alert>
    }

    @if (token()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <div class="flex flex-col gap-2 relative">
        <app-password
          id="password"
          label="Nueva contraseña"
          [control]="form.controls.password"
          placeholder="Mínimo 8 caracteres"
          [showStrengthMeter]="true"
        />
      </div>

      <div class="flex flex-col gap-2 relative">
        <app-password
          id="confirmPassword"
          label="Confirmar contraseña"
          [control]="form.controls.confirmPassword"
          placeholder="Repite tu contraseña"
        />
      </div>

      @if (isInvalid('confirmPassword') && form.errors?.['mismatch']) {
      <small class="text-xs text-red-500 font-medium -mt-2 mb-1 block">
        Las contraseñas no coinciden.
      </small>
      }

      <app-button type="submit" variant="primary" label="Actualizar contraseña" [fullWidth]="true"
        [loading]="loading()" class="mt-2" />
    </form>
    }

    <div class="mt-2 text-center">
      <a routerLink="/auth/login" class="flex justify-center w-full items-center gap-2 text-sm font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-100 no-underline transition-colors duration-300 mt-4">
        <i class="pi pi-arrow-left"></i> Volver al inicio de sesión
      </a>
    </div>
  </div>
</app-auth-layout>
