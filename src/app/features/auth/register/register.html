<div class="auth-layout">

  <!-- ── Panel izquierdo (branding) ──────────────────────── -->
  <div class="auth-brand">
    <div class="brand-inner">

      <a routerLink="/" class="brand-logo">
        <span class="logo-one">One</span><span class="logo-tech">Tech</span>
      </a>

      <div class="brand-copy">
        <h2>{{ brandData.title }}</h2>
        <p>{{ brandData.description }}</p>
      </div>

      <div class="brand-stats">
        @for (stat of brandData.stats; track stat.label; let last = $last) {
        <div class="brand-stat">
          <strong>{{ stat.value }}</strong>
          <span>{{ stat.label }}</span>
        </div>
        @if (!last) { <div class="stat-divider"></div> }
        }
      </div>

      <ul class="brand-perks">
        @for (perk of brandData.perks; track perk) {
        <li><i class="pi pi-check-circle"></i> {{ perk }}</li>
        }
      </ul>

    </div>
  </div>

  <!-- ── Panel derecho (formulario extraído a subcomponente) ──────────────────────── -->
  <app-register-form
    [formData]="formData"
    [fields]="fields"
    [formGroup]="form"
    [errorMsg]="errorMsg()"
    [loading]="loading()"
    (onSubmit)="onSubmit()"
    (onErrorClear)="errorMsg.set('')">
  </app-register-form>

</div>
