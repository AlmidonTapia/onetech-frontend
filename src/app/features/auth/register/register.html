<app-auth-layout [brandData]="brandData">
  <div class="w-full max-w-[460px] flex flex-col gap-7 bg-slate-50 dark:bg-slate-900 p-8 sm:p-10 rounded-2xl sm:rounded-[24px] shadow-lg border border-slate-200 dark:border-slate-700 transition-all duration-300 animate-fade-scale">
    <app-register-form
      [formData]="formData"
      [fields]="fields"
      [formGroup]="form"
      [errorMsg]="errorMsg()"
      [loading]="loading()"
      (onSubmit)="onSubmit()"
      (onErrorClear)="errorMsg.set('')">
    </app-register-form>
  </div>
</app-auth-layout>
