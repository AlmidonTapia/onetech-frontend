<app-auth-layout [brandData]="brandData">
  <div class="auth-form-card animate-fade-scale">
    <app-register-form
      [formData]="formData"
      [fields]="fields"
      [formGroup]="form"
      [errorMsg]="errorMsg()"
      [loading]="loading()"
      (onSubmit)="onSubmit()"
      (onErrorClear)="errorMsg.set('')">
    </app-register-form>
  </div>
</app-auth-layout>
